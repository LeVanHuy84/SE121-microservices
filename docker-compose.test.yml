# ==============================================================================
# docker-compose.test.yml — Unified Testing Environment (Inter-Service E2E, Chaos & Load Test)
# Project: SE121 - Social Network with AI Mental Health Support (Microservices)
# 
# Key Architecture:
# 1. Automatic Env Inheritance:
#    - Loads base configurations from .env, .env.production.local, and apps/<service>/.env
#    - Allows test-specific overrides from .env.test and .env.test.local
#    - Only overrides container hostnames and test-specific flags in the 'environment' section
# 2. 100% Isolated Infrastructure: Dedicated network, isolated volumes, separate container names
# 3. Dual Mode:
#    - E2E & Chaos Testing: Run default services (`docker compose -f docker-compose.test.yml up -d`)
#    - K6 Load Testing: Add `--profile loadtest` (`docker compose -f docker-compose.test.yml --profile loadtest up k6`)
# ==============================================================================

name: se121-test

networks:
  test-network:
    name: se121-test_network
    driver: bridge

volumes:
  postgres_test_data:
    name: se121-test_postgres_data
  mongo_test_data:
    name: se121-test_mongo_data
  redis_test_data:
    name: se121-test_redis_data
  kafka_test_data:
    name: se121-test_kafka_data
  rabbitmq_test_data:
    name: se121-test_rabbitmq_data
  elastic_test_data:
    name: se121-test_elastic_data
  hf_test_cache:
    name: se121-test_hf_cache

services:
  # ============================================================================
  # 1. TEST INFRASTRUCTURE & DATABASES
  # ============================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-test
    networks:
      - test-network
    ports:
      - '${POSTGRES_TEST_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-user_social_service}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:16-alpine
    container_name: postgres-init-test
    networks:
      - test-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tests/fixtures:/fixtures:ro
    entrypoint: >
      sh -c "
        PGPASSWORD=postgres psql -h postgres -U postgres -d postgres -c 'CREATE DATABASE content_feed_service;' 2>/dev/null || true;
        PGPASSWORD=postgres psql -h postgres -U postgres -d postgres -c 'CREATE DATABASE search_recommendation;' 2>/dev/null || true;
        PGPASSWORD=postgres psql -h postgres -U postgres -d user_social_service -c 'CREATE DATABASE user_social_service;' 2>/dev/null || true;
        echo 'All isolated PostgreSQL databases and user-social tables ready!';
      "

  mongodb:
    image: mongo:6.0
    container_name: mongodb-test
    networks:
      - test-network
    ports:
      - '${MONGO_TEST_PORT:-27017}:27017'
    volumes:
      - mongo_test_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-test
    networks:
      - test-network
    ports:
      - '${REDIS_TEST_PORT:-6379}:6379'
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-test
    networks:
      - test-network
    ports:
      - '${KAFKA_TEST_PORT:-9092}:9092' # External (Host test harness)
      - '9093:9093'                     # Internal (Container-to-container)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_HEAP_OPTS: '-Xmx256M -Xms128M'
    volumes:
      - kafka_test_data:/var/lib/kafka/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-test
    networks:
      - test-network
    ports:
      - '${RABBITMQ_TEST_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_TEST_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.7
    container_name: elasticsearch-test
    networks:
      - test-network
    ports:
      - '${ES_TEST_PORT:-9200}:9200'
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    volumes:
      - elastic_test_data:/usr/share/elasticsearch/data

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger-test
    networks:
      - test-network
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'
      - '${JAEGER_OTLP_GRPC_PORT:-4317}:4317'
      - '${JAEGER_OTLP_HTTP_PORT:-4318}:4318'
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ============================================================================
  # 2. CORE BACKEND MICROSERVICES (7 SERVICES)
  # ============================================================================

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway-test
    networks:
      - test-network
    ports:
      - '${GATEWAY_TEST_PORT:-4000}:4000'
      - '${GATEWAY_METRICS_PORT:-5000}:5000'
    env_file:
      - path: .env
        required: false
      - path: .env.production.local
        required: false
      - path: apps/api-gateway/.env
        required: false
      - path: apps/api-gateway/.env.production.local
        required: false
      - path: .env.test.local
        required: false
      - path: .env.test
        required: false
    environment:
      - NODE_ENV=test
      - ENABLE_LOAD_TEST_MODE=true
      - METRICS_PORT=5000
      - GATEWAY_PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - KAFKA_BROKERS=kafka:9093
      - ENABLE_OTEL=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - AI_CHATBOT_SERVICE_URL=http://ai-chatbot-service:4006
      - AI_CHATBOT_INTERNAL_KEY=${AI_CHATBOT_INTERNAL_KEY:-chatbot-internal-key-123}
      - CHATBOT_INTERNAL_KEY=${CHATBOT_INTERNAL_KEY:-chatbot-internal-key-123}
      - USER_SOCIAL_SERVICE_HOST=user-social-service
      - USER_SOCIAL_SERVICE_PORT=4001
      - CONTENT_FEED_SERVICE_HOST=content-feed-service
      - CONTENT_FEED_SERVICE_PORT=4002
      - CHAT_SERVICE_HOST=chat-service
      - CHAT_SERVICE_PORT=4004
      - EMOTION_INTELLIGENCE_SERVICE_HOST=emotion-intelligence-service
      - EMOTION_INTELLIGENCE_SERVICE_PORT=4005
      - SEARCH_RECOMMENDATION_SERVICE_HOST=search-recommendation-service
      - SEARCH_RECOMMENDATION_SERVICE_PORT=4003
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  user-social-service:
    build:
      context: .
      dockerfile: apps/user-social-service/Dockerfile
    container_name: user-social-test
    networks:
      - test-network
    ports:
      - '${USER_SOCIAL_TEST_PORT:-4001}:4001'
      - '${USER_SOCIAL_METRICS_PORT:-5001}:5001'
    env_file:
      - path: .env
        required: false
      - path: .env.production.local
        required: false
      - path: apps/user-social-service/.env
        required: false
      - path: apps/user-social-service/.env.production.local
        required: false
      - path: .env.test.local
        required: false
      - path: .env.test
        required: false
    environment:
      - NODE_ENV=test
      - ENABLE_LOAD_TEST_MODE=true
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-mock_clerk_secret_key_for_testing}
      - SYSTEM_ADMIN_EMAIL=${SYSTEM_ADMIN_EMAIL:-admin@example.com}
      - SYSTEM_ADMIN_PASSWORD=${SYSTEM_ADMIN_PASSWORD:-Admin@123456}
      - METRICS_PORT=5001
      - PORT=4001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/user_social_service
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/user_social_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - KAFKA_BROKERS=kafka:9093
      - ENABLE_OTEL=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - SEARCH_RECOMMENDATION_SERVICE_HOST=search-recommendation-service
      - SEARCH_RECOMMENDATION_SERVICE_PORT=4003
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started

  content-feed-service:
    build:
      context: .
      dockerfile: apps/content-feed-service/Dockerfile
    container_name: content-feed-test
    networks:
      - test-network
    ports:
      - '${CONTENT_FEED_TEST_PORT:-4002}:4002'
      - '${CONTENT_FEED_METRICS_PORT:-5002}:5002'
    env_file:
      - path: .env
        required: false
      - path: .env.production.local
        required: false
      - path: apps/content-feed-service/.env
        required: false
      - path: apps/content-feed-service/.env.production.local
        required: false
      - path: .env.test.local
        required: false
      - path: .env.test
        required: false
    environment:
      - NODE_ENV=test
      - ENABLE_LOAD_TEST_MODE=true
      - METRICS_PORT=5002
      - PORT=4002
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/content_feed_service
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/content_feed_service
      - MONGODB_URI=mongodb://mongodb:27017/content_feed
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POST_REDIS_HOST=redis
      - POST_REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - KAFKA_BROKERS=kafka:9093
      - ENABLE_OTEL=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - USER_SOCIAL_SERVICE_HOST=user-social-service
      - USER_SOCIAL_SERVICE_PORT=4001
      - EMOTION_INTELLIGENCE_SERVICE_HOST=emotion-intelligence-service
      - EMOTION_INTELLIGENCE_SERVICE_PORT=4005
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started

  search-recommendation-service:
    build:
      context: .
      dockerfile: apps/search-recommendation-service/Dockerfile
    container_name: search-recommendation-test
    networks:
      - test-network
    ports:
      - '${SEARCH_REC_TEST_PORT:-4003}:4003'
      - '${SEARCH_REC_METRICS_PORT:-5003}:5003'
    env_file:
      - path: .env
        required: false
      - path: .env.production.local
        required: false
      - path: apps/search-recommendation-service/.env
        required: false
      - path: apps/search-recommendation-service/.env.production.local
        required: false
      - path: .env.test.local
        required: false
      - path: .env.test
        required: false
    environment:
      - NODE_ENV=test
      - ENABLE_LOAD_TEST_MODE=true
      - METRICS_PORT=5003
      - PORT=4003
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/search_recommendation
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/search_recommendation
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9093
      - ES_NODE=http://elasticsearch:9200
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - ENABLE_OTEL=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - USER_SOCIAL_SERVICE_HOST=user-social-service
      - USER_SOCIAL_SERVICE_PORT=4001
      - EMOTION_INTELLIGENCE_SERVICE_HOST=emotion-intelligence-service
      - EMOTION_INTELLIGENCE_SERVICE_PORT=4005
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started

  chat-service:
    build:
      context: .
      dockerfile: apps/chat-service/Dockerfile
    container_name: chat-test
    networks:
      - test-network
    ports:
      - '${CHAT_TEST_PORT:-4004}:4004'
      - '${CHAT_METRICS_PORT:-5004}:5004'
    env_file:
      - path: .env
        required: false
      - path: .env.production.local
        required: false
      - path: apps/chat-service/.env
        required: false
      - path: apps/chat-service/.env.production.local
        required: false
      - path: .env.test.local
        required: false
      - path: .env.test
        required: false
    environment:
      - NODE_ENV=test
      - ENABLE_LOAD_TEST_MODE=true
      - STREAM_API_KEY=${STREAM_API_KEY:-mock_stream_api_key}
      - STREAM_API_SECRET=${STREAM_API_SECRET:-mock_stream_api_secret_for_testing_purposes_123456789}
      - METRICS_PORT=5004
      - PORT=4004
      - MONGODB_URI=mongodb://mongodb:27017/chat_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - KAFKA_BROKERS=kafka:9093
      - ENABLE_OTEL=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - USER_SOCIAL_SERVICE_HOST=user-social-service
      - USER_SOCIAL_SERVICE_PORT=4001
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started

  emotion-intelligence-service:
    build:
      context: .
      dockerfile: apps/emotion-intelligence-service/Dockerfile
    container_name: emotion-intelligence-test
    networks:
      - test-network
    ports:
      - '${EMOTION_TEST_PORT:-4005}:4005'
      - '${EMOTION_METRICS_PORT:-5005}:5005'
    env_file:
      - path: .env
        required: false
      - path: .env.production.local
        required: false
      - path: apps/emotion-intelligence-service/.env
        required: false
      - path: apps/emotion-intelligence-service/.env.production.local
        required: false
      - path: .env.test.local
        required: false
      - path: .env.test
        required: false
    environment:
      - NODE_ENV=test
      - ENABLE_LOAD_TEST_MODE=true
      - METRICS_PORT=5005
      - PORT=4005
      - MONGODB_URI=mongodb://mongodb:27017/emotion_intelligence
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - KAFKA_BROKERS=kafka:9093
      - ENABLE_OTEL=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started

  ai-chatbot-service:
    build:
      context: ./apps/ai-chatbot-service
      dockerfile: Dockerfile
    container_name: ai-chatbot-test
    networks:
      - test-network
    ports:
      - '${AI_CHATBOT_TEST_PORT:-4006}:4006'
      - '${AI_CHATBOT_METRICS_PORT:-5006}:5006'
    env_file:
      - path: .env
        required: false
      - path: .env.production.local
        required: false
      - path: apps/ai-chatbot-service/.env
        required: false
      - path: apps/ai-chatbot-service/.env.production.local
        required: false
      - path: .env.test.local
        required: false
      - path: .env.test
        required: false
    environment:
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-chatbot-internal-key-123}
      - X_INTERNAL_KEY=${X_INTERNAL_KEY:-chatbot-internal-key-123}
      - UNIT_TEST_MODE=true
      - METRICS_PORT=5006
      - PORT=4006
      - MONGO_URL=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - CHATBOT_REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKERS=kafka:9093
      - ES_NODE=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ENABLE_OTEL=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - USER_SOCIAL_SERVICE_HOST=user-social-service
      - USER_SOCIAL_SERVICE_PORT=4001
      - CONTENT_FEED_SERVICE_HOST=content-feed-service
      - CONTENT_FEED_SERVICE_PORT=4002
      - CHAT_SERVICE_HOST=chat-service
      - CHAT_SERVICE_PORT=4004
      - EMOTION_INTELLIGENCE_SERVICE_HOST=emotion-intelligence-service
      - EMOTION_INTELLIGENCE_SERVICE_PORT=4005
      - SEARCH_RECOMMENDATION_SERVICE_HOST=search-recommendation-service
      - SEARCH_RECOMMENDATION_SERVICE_PORT=4003
    volumes:
      - hf_test_cache:/root/.cache/huggingface
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started

  # ============================================================================
  # 3. K6 LOAD TESTING RUNNER (ON-DEMAND VIA PROFILE 'loadtest')
  # ============================================================================

  k6:
    image: grafana/k6:latest
    container_name: k6-test
    profiles:
      - loadtest
    networks:
      - test-network
    volumes:
      - ./tests/load:/scripts
    environment:
      - TARGET_URL=http://api-gateway:4000
      - SMOKE_TEST=${SMOKE_TEST:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
    command: ["run", "/scripts/k6-feed-session-loadtest.js"]
