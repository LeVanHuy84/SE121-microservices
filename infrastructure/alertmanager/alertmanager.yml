global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h
  receiver: 'default-webhook'

receivers:
  - name: 'default-webhook'
    # Replace URL with Slack/Discord/Alert-Relay webhook in production
    webhook_configs:
      - url: 'http://api-gateway:4000/api/v1/health'
        send_resolved: true
